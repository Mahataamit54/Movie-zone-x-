        /* SCREENSHOTS BOX CSS */

        .dl-sheet { background: #222; border-radius: 8px; margin-top: 15px; overflow: hidden; display: none; border: 1px solid #333; animation: slideDown 0.3s ease; }
        .dl-sheet.show { display: block; }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB9wJLIDDCx2q8WSo01R6xv1JK2Sp9GB44",
            authDomain: "movie-zonex.firebaseapp.com",
            databaseURL: "https://movie-zonex-default-rtdb.firebaseio.com",
            projectId: "movie-zonex",
            storageBucket: "movie-zonex.firebasestorage.app",
            messagingSenderId: "1071662323832",
            appId: "1:1071662323832:web:0e8434f7b0995a3ee1f58d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let movies = [];
        let currentList = [];
        let curMovie = null;
        let cIdx = 0;
        let view = 'home';
        let currentPage = 1;
        const itemsPerPage = 50;
        let carouselInterval;
        const noImageFallback = "https://placehold.co/200x300/222/666?text=No+Poster";

        db.ref('movies').on('value', s => {
            const d = s.val();
            if(d) {
                movies = Object.keys(d).map(k => ({id:k, ...d[k]})).reverse();
                if(view === 'home') { 
                    // HOME SCREEN PAR 18+ HIDE KAR DIYA
                    currentList = movies.filter(m => !(m.genre && m.genre.includes('18+')));
                    render(currentList); 
                    initCarousel(currentList.slice(0,5)); 
                }
            } else document.getElementById('grid').innerHTML = "<p style='padding:20px; color:#666; grid-column:1/-1;'>No movies found.</p>";
        });

        function filter(g, btn) {
            const allChip = document.getElementById('chip-all');
            if (g === 'All') {
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
            } else {
                if (btn.classList.contains('active')) btn.classList.remove('active');
                else btn.classList.add('active');
                allChip.classList.remove('active');
                if (document.querySelectorAll('.chip.active').length === 0) allChip.classList.add('active');
            }

            const activeElements = document.querySelectorAll('.chip.active');
            let selectedTags = [];
            activeElements.forEach(el => selectedTags.push(el.innerText.trim()));

            document.getElementById('search-input').value = '';
            currentPage = 1;

            if (selectedTags.includes('All') || selectedTags.length === 0) {
                // ALL FILTER PAR 18+ HIDE KAR DIYA
                currentList = movies.filter(m => !(m.genre && m.genre.includes('18+')));
            } else {
                currentList = movies.filter(m => {
                    if (!m.genre) return false;
                    const mGenres = m.genre.toLowerCase();
                    return selectedTags.every(tag => mGenres.includes(tag.toLowerCase()));
                });
            }
            render(currentList);
        }

        function render(list) {
            const g = document.getElementById('grid'); 
            if(list.length === 0) {
                g.innerHTML = '<p style="padding:20px; color:#666; grid-column: 1 / -1;">No movies found.</p>';
                return;
            }
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const visibleList = list.slice(start, end);

            let html = visibleList.map(m => {
                let finalPoster = m.poster ? m.poster : noImageFallback;
                return `
                <div class="card" onclick='openModal(${JSON.stringify(m).replace(/'/g, "&#39;")})'>
                    <div class="poster-box">
                        <img src="${finalPoster}" loading="lazy" onerror="this.onerror=null; this.src='${noImageFallback}';">
                    </div>
                    <div class="card-info">${m.title || 'Unknown Title'}</div>
                    <div class="card-info card-sub">${m.genre || ''}</div>
                </div>`;
            }).join('');

            const totalPages = Math.ceil(list.length / itemsPerPage);
            if(totalPages > 1) {
                html += `<div class="pagination">
                    <button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i></button>`;
                for(let i = 1; i <= totalPages; i++) {
                    if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                         html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
                    } else if (i === currentPage - 2 || i === currentPage + 2) {
                        html += `<span style="color:#666;">...</span>`;
                    }
                }
                html += `<button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}><i class="fas fa-chevron-right"></i></button></div>`;
            }
            g.innerHTML = html;
        }

        function changePage(p) {
            const totalPages = Math.ceil(currentList.length / itemsPerPage);
            if(p < 1 || p > totalPages) return;
            currentPage = p;
            render(currentList);
            document.querySelector('.genres').scrollIntoView({behavior: 'smooth'});
        }

        function toggleSearch() {
            const input = document.getElementById('search-input');
            input.classList.toggle('active');
            if(input.classList.contains('active')) {
                input.focus();
            } else {
                input.value = '';
                currentPage = 1;
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                document.getElementById('chip-all').classList.add('active');
                // SEARCH CLOSE PAR 18+ HIDE KAR DIYA
                currentList = movies.filter(m => !(m.genre && m.genre.includes('18+')));
                render(currentList); 
            }
        }

        document.getElementById('search-input').addEventListener('keyup', (e) => {
            const val = e.target.value.toLowerCase();
            currentPage = 1;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            currentList = movies.filter(m => 
                (m.title && m.title.toLowerCase().includes(val)) || 
                (m.genre && m.genre.toLowerCase().includes(val))
            );
            render(currentList);
        });

        function switchTab(v) {
            view = v;
            currentPage = 1; 
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            if(v === 'home') {
                document.querySelectorAll('.nav-item')[0].classList.add('active');
                // TAB CHANGE PAR 18+ HIDE KAR DIYA
                currentList = movies.filter(m => !(m.genre && m.genre.includes('18+')));
                render(currentList);
                document.querySelector('.carousel-scene').style.display = 'flex';
                document.querySelector('.genres').style.display = 'flex';
                document.querySelector('.seo-footer').style.display = 'block';
            } else {
                document.querySelectorAll('.nav-item')[1].classList.add('active');
                currentList = JSON.parse(localStorage.getItem('favs')) || [];
                render(currentList);
                document.querySelector('.carousel-scene').style.display = 'none';
                document.querySelector('.genres').style.display = 'none';
                document.querySelector('.seo-footer').style.display = 'none';
            }
        }

        function initCarousel(list) {
            const c = document.getElementById('carousel'); c.innerHTML =
